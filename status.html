<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowBOT — System Status</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --card-bg: #0d0d0d;
    --card-border: #1a1a1a;
    --cyan: #00ffe5;
    --green: #00ff88;
    --red: #ff3366;
    --yellow: #ffe066;
    --text: #e0e0e0;
    --text-dim: #666;
    --font-header: 'Orbitron', monospace;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; padding: 16px; }
  .header { max-width: 1400px; margin: 0 auto 14px; padding: 6px 4px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .back-home { color: var(--text-dim); font-family: var(--font-header); letter-spacing: 1px; text-decoration: none; font-size: 13px; font-weight: 600; padding: 4px 10px; border: 1px solid #333; border-radius: 8px; white-space: nowrap; }
  .back-home:hover { color: var(--cyan); border-color: var(--cyan); }
  .logo { font-family: var(--font-header); font-size: 1.2rem; font-weight: 900; color: var(--cyan); letter-spacing: 2px; }
  .logo span { color: var(--text-dim); font-weight: 400; }
  .updated-at { font-size: 0.6rem; color: var(--text-dim); font-family: var(--font-mono); }

  .wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.3; }
  .card-title { font-family: var(--font-header); font-size: 0.65rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }

  .light { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .light.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .light.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .light.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
  .light.gray { background: #444; }

  /* Gauges */
  .gauge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .gauge { background: #111; border-radius: 8px; padding: 14px; }
  .gauge-label { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .gauge-value { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; color: var(--text); }
  .gauge-value small { font-size: 0.7rem; color: var(--text-dim); font-weight: 400; }
  .gauge-human { font-size: 0.72rem; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }
  .gauge-bar-wrap { margin-top: 10px; height: 8px; background: #1a1a1a; border-radius: 4px; overflow: hidden; }
  .gauge-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .gauge-bar.ok { background: var(--green); }
  .gauge-bar.warn { background: var(--yellow); }
  .gauge-bar.crit { background: var(--red); }

  /* Agent sprites */
  .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .agent { background: #111; border-radius: 8px; padding: 12px 10px; text-align: center; position: relative; overflow: hidden; }
  .agent .stage { height: 44px; position: relative; margin-bottom: 8px; }
  .sprite { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-size: 1.6rem; line-height: 1; }
  .sprite.run { animation: run 1.6s ease-in-out infinite alternate; }
  .sprite.idle { opacity: 0.35; filter: grayscale(1); }
  .agent .name { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text); }
  .agent .state { font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
  .agent .state.on { color: var(--green); }
  .agent .state.off { color: #555; }
  @keyframes run {
    0% { left: 12%; transform: translateX(-50%) scaleX(1); }
    49% { transform: translateX(-50%) scaleX(1); }
    50% { left: 88%; transform: translateX(-50%) scaleX(-1); }
    99% { transform: translateX(-50%) scaleX(-1); }
    100% { left: 12%; transform: translateX(-50%) scaleX(1); }
  }

  .status-row { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.72rem; }
  .status-row .label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-size: 0.58rem; }

  .footer { text-align: center; color: var(--text-dim); font-size: 0.6rem; padding: 20px; font-family: var(--font-mono); }
  .footer span { color: var(--cyan); }

  @media (max-width: 768px) {
    body { padding: 10px; }
    .header { flex-direction: column; gap: 12px; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a class="back-home" href="https://flowstate43.github.io/crypto-flow-dashboard/">&larr; FlowBOT</a>
    <div class="logo">Flow<span>STATUS</span></div>
  </div>
  <div class="updated-at" id="updated-at">Loading&hellip;</div>
</div>

<div class="wrap">

  <!-- System health -->
  <div class="card">
    <div class="card-title">How the machine is doing</div>
    <div class="gauge-grid">
      <div class="gauge">
        <div class="gauge-label">Memory (RAM)</div>
        <div class="gauge-value" id="ram-val">&mdash;</div>
        <div class="gauge-human" id="ram-human">&mdash;</div>
        <div class="gauge-bar-wrap"><div class="gauge-bar" id="ram-bar" style="width:0%"></div></div>
      </div>
      <div class="gauge">
        <div class="gauge-label">Storage</div>
        <div class="gauge-value" id="disk-val">&mdash;</div>
        <div class="gauge-human" id="disk-human">&mdash;</div>
        <div class="gauge-bar-wrap"><div class="gauge-bar" id="disk-bar" style="width:0%"></div></div>
      </div>
      <div class="gauge">
        <div class="gauge-label">CPU</div>
        <div class="gauge-value" id="cpu-val">&mdash;</div>
        <div class="gauge-human" id="cpu-human">&mdash;</div>
        <div class="gauge-bar-wrap"><div class="gauge-bar" id="cpu-bar" style="width:0%"></div></div>
      </div>
      <div class="gauge">
        <div class="gauge-label">Uptime</div>
        <div class="gauge-value" id="uptime-val">&mdash;</div>
        <div class="gauge-human" id="uptime-human">&mdash;</div>
        <div class="status-row" style="margin-top:10px"><span class="light green" id="uptime-light"></span><span class="label">running</span></div>
      </div>
    </div>
  </div>

  <!-- Agents -->
  <div class="card">
    <div class="card-title">The crew</div>
    <div class="agent-grid" id="agent-grid"><div class="gauge-human">Loading&hellip;</div></div>
  </div>

  <!-- Memory -->
  <div class="card">
    <div class="card-title">Memory</div>
    <div class="status-row" id="memory-row"><span class="light gray"></span><span class="label">checking&hellip;</span></div>
  </div>

</div>

<div class="footer">
  FlowBOT system status &middot; updates every 5 min &middot; <span>OpenClaw</span>
</div>

<script>
// Emoji sprite per agent (fallback to a generic bot)
const SPRITES = {
  coordinator: '🧭', mort: '📈', steve: '🌙', writer: '✍️', researcher: '🔍',
  reviewer: '🔎', trainer: '🎓', chat: '💬', codey: '💻', openclaw: '🤖'
};

function lightClass(pct) {
  if (pct >= 85) return 'crit';
  if (pct >= 65) return 'warn';
  return 'ok';
}
function humanRam(pct) {
  if (pct >= 85) return 'Running low — close to full.';
  if (pct >= 65) return 'Getting busy, but still fine.';
  return 'Plenty of room to think.';
}
function humanDisk(pct) {
  if (pct >= 85) return 'Almost full — time to clean up.';
  if (pct >= 65) return 'Filling up, but okay.';
  return 'Tons of space left.';
}
function humanCpu(loadPct) {
  if (loadPct >= 85) return 'Working hard right now.';
  if (loadPct >= 40) return 'Busy, but keeping up.';
  return 'Relaxed — barely breaking a sweat.';
}
function humanUptime(h) {
  if (h < 1) return 'Just woke up.';
  if (h < 24) return 'Been up a few hours.';
  const d = Math.floor(h / 24);
  return 'Up for ' + d + ' day' + (d === 1 ? '' : 's') + ' straight.';
}

async function load() {
  try {
    const r = await fetch('system_status.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();

    document.getElementById('updated-at').textContent = 'Updated ' + d.ts;

    // RAM
    const ram = d.ram || {};
    document.getElementById('ram-val').innerHTML = ram.used_gb + '<small> of ' + ram.total_gb + ' GB</small>';
    document.getElementById('ram-human').textContent = humanRam(ram.used_pct || 0);
    const ramBar = document.getElementById('ram-bar');
    ramBar.style.width = (ram.used_pct || 0) + '%';
    ramBar.className = 'gauge-bar ' + lightClass(ram.used_pct || 0);

    // Disk
    const disk = d.disk || {};
    document.getElementById('disk-val').innerHTML = disk.used_gb + '<small> of ' + disk.total_gb + ' GB</small>';
    document.getElementById('disk-human').textContent = humanDisk(disk.used_pct || 0);
    const diskBar = document.getElementById('disk-bar');
    diskBar.style.width = (disk.used_pct || 0) + '%';
    diskBar.className = 'gauge-bar ' + lightClass(disk.used_pct || 0);

    // CPU
    const cpu = d.cpu || {};
    document.getElementById('cpu-val').innerHTML = cpu.load1 + '<small> load</small>';
    document.getElementById('cpu-human').textContent = humanCpu(cpu.load_pct || 0);
    const cpuBar = document.getElementById('cpu-bar');
    cpuBar.style.width = Math.min(100, cpu.load_pct || 0) + '%';
    cpuBar.className = 'gauge-bar ' + lightClass(cpu.load_pct || 0);

    // Uptime
    document.getElementById('uptime-val').innerHTML = (d.uptime_h || 0) + '<small> hrs</small>';
    document.getElementById('uptime-human').textContent = humanUptime(d.uptime_h || 0);

    // Agents
    const agents = d.agents || [];
    const ag = document.getElementById('agent-grid');
    if (agents.length) {
      ag.innerHTML = agents.map(a => {
        const sprite = SPRITES[a.name] || '🤖';
        const cls = a.active ? 'run' : 'idle';
        const state = a.active ? 'on duty' : 'offline';
        const stateCls = a.active ? 'on' : 'off';
        return '<div class="agent"><div class="stage"><span class="sprite ' + cls + '">' + sprite + '</span></div>' +
               '<div class="name">' + a.name + '</div>' +
               '<div class="state ' + stateCls + '">' + state + '</div></div>';
      }).join('');
    } else {
      ag.innerHTML = '<div class="gauge-human">No agents found</div>';
    }

    // Memory
    const mem = d.memory || {};
    const memRow = document.getElementById('memory-row');
    if (mem.db_exists) {
      memRow.innerHTML = '<span class="light green"></span><span class="label">memory online &middot; ' + mem.db_size_mb + ' MB of notes</span>';
    } else {
      memRow.innerHTML = '<span class="light red"></span><span class="label">memory offline</span>';
    }
  } catch (e) {
    document.getElementById('updated-at').textContent = 'Error: ' + e.message;
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
